<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Debug Payment UI</title>
    <style>
      :root {
        --primary: #4f46e5;
        --secondary: #64748b;
        --success: #22c55e;
        --danger: #ef4444;
        --warning: #f59e0b;
        --info: #3b82f6;
        --dark: #1e293b;
        --light: #f1f5f9;
        --white: #ffffff;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --bg-primary: #f8fafc;
        --bg-secondary: #ffffff;
        --border-color: #e2e8f0;
        --sidebar-width: 280px;
        --header-height: 70px;
      }

      body {
        margin: 0;
        padding: 20px;
        font-family: sans-serif;
        background: #f0f0f0;
      }

      .invoice-layout {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
        align-items: start;
      }

      .card {
        background: white;
        border-radius: 10px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .card-header {
        padding: 15px;
      }

      /* Styles from ver_pedido.php */
      .payment-tabs {
        display: flex;
        border-bottom: 2px solid #334155;
        margin-bottom: 20px;
      }

      .tab-btn {
        flex: 1;
        padding: 15px;
        background: none;
        border: none;
        font-weight: 600;
        color: #94a3b8;
        cursor: pointer;
        transition: all 0.3s;
        border-bottom: 3px solid transparent;
        font-size: 16px;
      }

      .tab-btn:hover {
        color: var(--primary);
        background: rgba(255, 255, 255, 0.05);
      }

      .tab-btn.active {
        color: var(--primary);
        border-bottom-color: var(--primary);
        background: rgba(99, 102, 241, 0.1);
      }

      .tab-pane {
        display: none;
        animation: fadeIn 0.3s ease;
      }

      .tab-pane.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .mixed-payment-row {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
      }

      .mixed-payment-row select,
      .mixed-payment-row input {
        padding: 12px;
        border: 1px solid #475569;
        border-radius: 8px;
        background: #1e293b;
        color: white;
        font-size: 15px;
      }

      /* Fix for visibility against white card background */
      .mixed-payment-row select,
      .mixed-payment-row input {
        color: black;
        background: white;
        border: 1px solid #ccc;
      }

      .mixed-payment-row select {
        flex: 1;
      }
      .mixed-payment-row input {
        width: 140px;
        text-align: right;
      }

      .btn-remove {
        background: rgba(220, 38, 38, 0.2);
        color: #f87171;
        border: 1px solid #dc2626;
        border-radius: 8px;
        width: 45px;
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .payment-summary {
        background: #1e293b;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 25px;
        border: 1px solid #334155;
        color: white; /* Ensure text is visible */
      }

      .btn-primary {
        background: var(--primary);
        color: white;
        border: none;
        padding: 10px;
        width: 100%;
        border-radius: 8px;
        cursor: pointer;
      }
      .btn-secondary {
        background: #eee;
        color: #333;
        border: 1px solid #ccc;
        padding: 5px 10px;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="invoice-layout">
      <div class="card">
        <div
          class="card-header"
          style="background: var(--success); color: white"
        >
          <h3>Procesar Pago</h3>
        </div>

        <div class="payment-tabs">
          <button class="tab-btn active" onclick="switchTab('single')">
            Pago Único
          </button>
          <button class="tab-btn" onclick="switchTab('mixed')">
            Pago Mixto
          </button>
          <button class="tab-btn" onclick="switchTab('split')">
            Dividir Cuenta
          </button>
          <button class="tab-btn" onclick="switchTab('individual')">
            Pago por Consumo
          </button>
        </div>

        <div class="tab-content" style="padding: 30px">
          <!-- PAGO ÚNICO -->
          <div id="tab-single" class="tab-pane active">
            <p>Content for Single Payment</p>
          </div>

          <!-- PAGO MIXTO -->
          <div id="tab-mixed" class="tab-pane">
            <form id="mixed-form">
              <div id="mixed-payments-container">
                <!-- Dynamic rows -->
              </div>

              <button
                type="button"
                class="btn btn-secondary"
                onclick="addMixedPaymentRow()"
                style="margin-bottom: 20px"
              >
                + Agregar Método
              </button>

              <div class="payment-summary">Summary here</div>

              <button type="submit" id="btn-mixed-pay" class="btn btn-primary">
                Procesar Pago Mixto
              </button>
            </form>
          </div>

          <!-- Other tabs omitted for brevity -->
          <div id="tab-split" class="tab-pane">Split Content</div>
          <div id="tab-individual" class="tab-pane">Individual Content</div>
        </div>
      </div>
    </div>

    <script>
      const TOTAL_BILL = 235.0;
      const ORDER_ITEMS = [];

      function switchTab(tabName) {
        console.log("Switching to", tabName);
        // Hide all tabs
        document
          .querySelectorAll(".tab-pane")
          .forEach((el) => el.classList.remove("active"));
        document
          .querySelectorAll(".tab-btn")
          .forEach((el) => el.classList.remove("active"));

        // Show selected
        const tab = document.getElementById("tab-" + tabName);
        if (tab) tab.classList.add("active");

        // Activate button
        const btns = document.querySelectorAll(".tab-btn");
        const index = ["single", "mixed", "split", "individual"].indexOf(
          tabName
        );
        if (index >= 0 && btns[index]) {
          btns[index].classList.add("active");
        }

        if (tabName === "mixed") {
          const container = document.getElementById("mixed-payments-container");
          console.log("Mixed container children:", container.children.length);
          if (container.children.length === 0) {
            console.log("Adding first row");
            addMixedPaymentRow();
          }
        }
      }

      function addMixedPaymentRow() {
        console.log("Adding row");
        const container = document.getElementById("mixed-payments-container");
        const div = document.createElement("div");
        div.className = "mixed-payment-row";
        div.innerHTML = `
        <select name="mixed_methods[]">
            <option value="cash">💵 Efectivo</option>
            <option value="card">💳 Tarjeta</option>
            <option value="transfer">🏦 Transferencia</option>
        </select>
        <input type="number" name="mixed_amounts[]" step="0.01" value="0.00">
        <button type="button" class="btn-remove" onclick="this.parentElement.remove()">×</button>
    `;
        container.appendChild(div);
      }
    </script>
  </body>
</html>
